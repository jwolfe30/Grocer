<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Grocer feature graphic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3f6f1;
        --bg-deep: #e4ebe0;
        --ink: #14201a;
        --ink-muted: #4a5c52;
        --leaf: #1f6b45;
        --leaf-deep: #134a2f;
        --accent: #c45c26;
        --line: #c9d5cc;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1024px;
        height: 500px;
        overflow: hidden;
        background: transparent;
      }
      .banner {
        width: 1024px;
        height: 500px;
        position: relative;
        display: flex;
        align-items: center;
        padding: 0 88px;
        background:
          radial-gradient(ellipse 55% 80% at 88% 50%, rgba(31, 107, 69, 0.14) 0%, transparent 60%),
          radial-gradient(ellipse 40% 70% at 8% 90%, rgba(196, 92, 38, 0.1) 0%, transparent 55%),
          linear-gradient(118deg, #eef3eb 0%, var(--bg) 38%, var(--bg-deep) 100%);
        overflow: hidden;
      }
      .banner::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, transparent 0%, transparent 72%, rgba(19, 74, 47, 0.04) 100%),
          radial-gradient(circle at 92% 18%, rgba(31, 107, 69, 0.09) 0 70px, transparent 71px),
          radial-gradient(circle at 78% 78%, rgba(31, 107, 69, 0.07) 0 50px, transparent 51px);
        pointer-events: none;
      }
      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 18px;
        max-width: 720px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .mark {
        width: 96px;
        height: 96px;
        border-radius: 26px;
        flex-shrink: 0;
        background: linear-gradient(160deg, var(--leaf) 0%, var(--leaf-deep) 100%);
        box-shadow: 0 14px 28px rgba(20, 32, 26, 0.14);
        display: grid;
        place-items: center;
      }
      .mark svg {
        width: 58px;
        height: 58px;
      }
      .wordmark {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 700;
        font-size: 120px;
        line-height: 0.92;
        letter-spacing: -0.035em;
        color: var(--ink);
      }
      .tagline {
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        font-weight: 600;
        font-size: 34px;
        letter-spacing: 0.01em;
        color: var(--ink-muted);
        padding-left: 124px;
      }
      .rule {
        width: 72px;
        height: 4px;
        border-radius: 2px;
        background: var(--accent);
        margin-left: 124px;
        margin-top: -4px;
      }
    </style>
  </head>
  <body>
    <div class="banner" id="capture">
      <div class="content">
        <div class="row">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 120 120">
              <path
                fill="#f3f6f1"
                d="M98 22c-28 4-52 22-64 48-4 9-6 18-6 28 14-2 28-8 38-18 18-18 30-40 32-58z"
              />
              <path
                fill="none"
                stroke="#134a2f"
                stroke-width="5"
                stroke-linecap="round"
                d="M34 96c18-22 38-38 64-48"
                opacity="0.45"
              />
              <path
                fill="#c45c26"
                d="M28 98c2-10 8-18 16-24-4 14-2 24 2 34-8-2-14-6-18-10z"
              />
            </svg>
          </div>
          <h1 class="wordmark">Grocer</h1>
        </div>
        <div class="rule" aria-hidden="true"></div>
        <p class="tagline">Fair prices, free to use</p>
      </div>
    </div>
  </body>
</html>
