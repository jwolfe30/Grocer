name: QA

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    name: Lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: QA
        run: npm run qa
