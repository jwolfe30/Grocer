name: Bug report
description: File a defect so it can be tracked and closed with QA
title: "[Bug]: "
labels: ["bug", "ready-for-agent"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what broke and how to reproduce it. The agent will close this
        ticket with the fix summary, resolution notes, and QA evidence.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add milk and eggs to the list
        2. Set savings threshold to 0
        3. Click Optimize
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: qa_plan
    attributes:
      label: QA plan
      value: |
        - [ ] `npm run qa` (lint + production build)
        - [ ] Reproduce the original failure and confirm it is gone
        - [ ] Re-check the surrounding list / match / optimize flow
    validations:
      required: true
