name: Task
description: Track chores, refactors, or setup work as a ticket
title: "[Task]: "
labels: ["ready-for-agent"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for work that is not a user-facing feature or a bug.
        Completion still requires summary, changes, resolution, and QA.
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in and out of this ticket.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: qa_plan
    attributes:
      label: QA plan
      value: |
        - [ ] `npm run qa` (lint + production build)
        - [ ] Verify the changed workflow or docs behave as described
    validations:
      required: true
